# Только авто-мёрж в main. Деплой отсюда убран (2026-08-07): FTP Timeweb из
# GitHub Actions регулярно отваливался по таймауту, причём первый шаг мог
# помечаться зелёным без реального трансфера — в итоге main уезжал вперёд, а
# прод молча оставался на старом коде. Доставка теперь ручная и проверяемая:
# scripts/deploy-prod.sh с dev-VPS (заливка + сверка хешей + deploy:refresh).
name: Auto Merge

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-merge:
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Merge to main
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Merging branch: $BRANCH_NAME"

          git fetch origin main:main || git branch main
          git checkout main

          git merge --no-ff -m "Auto-merge: $BRANCH_NAME -> main" origin/$BRANCH_NAME

          git push origin main

          # Keep the source branch in sync with main to prevent drift.
          # main now contains the branch tip (via the merge commit), so updating
          # the branch to main is a fast-forward — no force, no conflicts next time.
          # Best-effort: never fail the pipeline if the branch moved concurrently.
          git push origin main:"$BRANCH_NAME" \
            || echo "::warning::Could not fast-forward $BRANCH_NAME to main (concurrent update?)"
