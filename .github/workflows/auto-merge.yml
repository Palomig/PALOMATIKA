name: Auto Merge and Deploy

on:
  push:
    branches:
      - 'claude/**'
      - 'main'

jobs:
  auto-merge:
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Merge to main
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Merging branch: $BRANCH_NAME"

          git fetch origin main:main || git branch main
          git checkout main

          git merge --no-ff -m "Auto-merge: $BRANCH_NAME -> main" origin/$BRANCH_NAME

          git push origin main

  deploy:
    needs: auto-merge
    # Run after auto-merge on claude/** push, OR directly on main push
    if: |
      always() && (needs.auto-merge.result == 'success' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy to Timeweb via FTP
        id: ftp-deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /OGE/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/tests/**
            **/phpunit.xml
            **/*.md
            **/.DS_Store
            **/vendor/**
            **/docs/oge_project_package.zip

      - name: Wait 30s before retry
        if: steps.ftp-deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Timeweb via FTP (retry)
        if: steps.ftp-deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /OGE/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/tests/**
            **/phpunit.xml
            **/*.md
            **/.DS_Store
            **/vendor/**
            **/docs/oge_project_package.zip

      - name: Trigger deploy refresh webhook
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" ]; then
            curl -s -X POST "https://cw95865.tmweb.ru/api/deploy/refresh" \
              -H "X-Deploy-Secret: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
              -H "Content-Type: application/json" \
              --max-time 120
          else
            echo "DEPLOY_WEBHOOK_SECRET not configured, skipping webhook"
          fi
