# Ветки `claude/**` авто-мержатся в `develop` — интеграционную песочницу.
# На прод НИЧЕГО отсюда не уезжает.
#
# Почему не в main (изменено 2026-08-26): раньше целью был `main`, а `main` —
# это то, что деплоится. Фича становилась «релизной» в момент первого пуша,
# ещё не будучи готовой. Так генератор печатных вариантов месяц провисел в
# main незалитым и сломал маркер деплоя: чтобы срочно выкатить фикс, пришлось
# деплоить точечно и откатывать маркер руками.
#
# Теперь:
#   claude/**  → авто-мёрж в develop        (ничего не деплоится)
#   готово     → scripts/promote.sh <ветка> (мёрж в main + доставка на прод)
#
# `develop` в `main` не мержится НИКОГДА — иначе схема вырождается в прежнюю.
# Ветки фич отходят от `main`, не от `develop`.
name: Auto Merge

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-merge:
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Merge to develop
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Merging branch: $BRANCH_NAME -> develop"

          # develop создаётся от main, если её ещё нет.
          git fetch origin develop:develop || git branch develop origin/main
          git checkout develop

          if ! git merge --no-ff -m "Auto-merge: $BRANCH_NAME -> develop" "origin/$BRANCH_NAME"; then
            git merge --abort || true
            echo "::error::Конфликт при мёрже $BRANCH_NAME в develop — разрулить вручную."
            exit 1
          fi

          git push origin develop

          # ВАЖНО: ветка НЕ синхронизируется обратно с develop (раньше main
          # заливался в ветку «против дрейфа»). Если влить сюда develop, ветка
          # начнёт таскать чужую незрелую работу, и мёрж её в main утянет на
          # прод всё подряд — ровно то, от чего уходим.
