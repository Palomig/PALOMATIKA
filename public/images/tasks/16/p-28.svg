<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Circumcircle -->
  <circle cx="110" cy="110" r="92" fill="none" stroke="#111" stroke-width="2.2"/>

  <!-- Equilateral triangle inscribed in circle -->
  <polygon points="110,18 30.33,156 189.67,156" fill="none" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Segment from center to base -->
  <line x1="110" y1="110" x2="110" y2="156" stroke="#111" stroke-width="2.2"/>

  <!-- Right-angle marker at foot on base -->
  <path d="M110 156 L118 156 L118 148 L110 148" fill="none" stroke="#111" stroke-width="2"/>

  <!-- Center label -->
  <text x="98" y="101" font-family="Times New Roman, serif" font-style="italic" font-size="28" fill="#111">O</text>
</svg>
